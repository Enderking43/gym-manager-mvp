<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiosco — Gimnasio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Sin scroll, sin selección de texto, sin cursor de mouse */
    * { user-select: none; -webkit-user-select: none; box-sizing: border-box; }
    html, body { overflow: hidden; cursor: none; margin: 0; padding: 0; }

    /* Reloj con números de ancho fijo para evitar saltos */
    #clock { font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }

    /* Transición suave entre slides */
    #slider-bg { transition: background 1.8s ease-in-out; }

    /* Texto del slide */
    .slide-text { transition: opacity 0.6s ease-in-out; }

    /* Entrada del splash */
    @keyframes splashIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    #splash.visible { animation: splashIn 0.25s ease-out forwards; }

    /* Pulso en el ícono del splash */
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.07); }
    }
    #splash-icon { animation: iconPulse 1.8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-950 text-white h-screen w-screen relative flex flex-col">

  <!-- ── Fondo del slider (gradiente que transiciona) ─────────────────── -->
  <div id="slider-bg" class="absolute inset-0"></div>

  <!-- ── Capa oscura semi-transparente para legibilidad ────────────────── -->
  <div class="absolute inset-0 bg-black/55"></div>

  <!-- ── Contenido principal ───────────────────────────────────────────── -->
  <div class="relative z-10 flex flex-col h-full">

    <!-- Encabezado: nombre del gimnasio -->
    <header class="pt-8 pb-2 text-center">
      <h1 class="text-3xl font-black tracking-[0.3em] uppercase text-white/90 drop-shadow-lg">
        GIMNASIO MVP
      </h1>
      <div class="mt-1 mx-auto w-24 h-0.5 bg-white/30 rounded-full"></div>
    </header>

    <!-- Texto motivacional del slide -->
    <div class="mt-6 text-center px-12 min-h-[6rem] flex flex-col items-center justify-center">
      <p id="slide-title" class="slide-text text-4xl font-bold drop-shadow-lg text-white"></p>
      <p id="slide-sub"   class="slide-text text-xl text-white/70 mt-2 drop-shadow"></p>
    </div>

    <!-- Reloj digital (elemento dominante) -->
    <div class="flex-1 flex flex-col items-center justify-center gap-3">
      <div id="clock" class="text-[clamp(5rem,14vw,9rem)] font-black leading-none drop-shadow-2xl">
        00:00:00
      </div>
      <div id="date-display" class="text-2xl text-white/60 font-light capitalize drop-shadow"></div>
    </div>

    <!-- Área de ingreso de DNI -->
    <div class="pb-12 text-center">
      <p class="text-base text-white/50 uppercase tracking-[0.25em] mb-5">
        Ingresa tu DNI y presiona Enter
      </p>
      <!-- Display de los dígitos que el usuario va tipeando -->
      <div id="dni-display"
           class="inline-block text-5xl font-mono tracking-[0.5em] text-white/80 font-bold
                  px-8 py-3 rounded-2xl bg-white/5 border border-white/10 min-w-[22rem] min-h-[4.5rem]
                  drop-shadow-lg">
        &#8203;
      </div>
    </div>
  </div>

  <!-- ── Input invisible que captura el teclado (siempre enfocado) ──────── -->
  <!--
    Posicionado fuera de pantalla (no oculto con display:none ni visibility:hidden
    para que el navegador permita hacer focus() sobre él).
  -->
  <input
    id="dni-input"
    type="text"
    inputmode="numeric"
    maxlength="8"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
    class="absolute -top-20 left-0 w-px h-px opacity-0"
    tabindex="0"
  />

  <!-- ── Splash screen (overlay a pantalla completa) ───────────────────── -->
  <div id="splash"
       class="absolute inset-0 z-50 hidden flex-col items-center justify-center text-center px-12">

    <!-- Fondo coloreado del splash -->
    <div id="splash-bg" class="absolute inset-0"></div>

    <div class="relative z-10 flex flex-col items-center gap-6 max-w-2xl w-full">

      <!-- Ícono de estado -->
      <div id="splash-icon"
           class="w-36 h-36 rounded-full bg-white/20 flex items-center justify-center
                  text-7xl font-black border-4 border-white/40 shadow-2xl">
      </div>

      <!-- Nombre del socio -->
      <div id="splash-name" class="text-6xl font-black drop-shadow-xl leading-tight"></div>

      <!-- Mensaje principal -->
      <div id="splash-message" class="text-3xl font-semibold drop-shadow"></div>

      <!-- Mensaje secundario -->
      <div id="splash-sub" class="text-lg text-white/80 max-w-lg leading-relaxed drop-shadow"></div>

      <!-- Barra de progreso del countdown -->
      <div class="mt-6 w-72 h-1.5 bg-white/25 rounded-full overflow-hidden">
        <div id="countdown-bar"
             class="h-full bg-white rounded-full"
             style="width: 100%; transition: none;">
        </div>
      </div>

      <div id="splash-countdown" class="text-base text-white/60 -mt-3"></div>
    </div>
  </div>

  <script src="kiosk.js"></script>
</body>
</html>
